services:
  bot:
    build: .
    container_name: solo_leveling_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data_storage:/app/storage   # здесь будет лежать db.sql на хосте
      # ОТДЕЛЬНЫЙ том для хранилища состояния (ключи сообщений профиля, кэш file_id гайда,
      # очередь автоудаления - см. bot/state_store.py). Не входит в автобэкап и не
      # затрагивается, если db.sql откатывают из бэкапа или подменяют.
      - ./data_state:/app/state
    environment:
      - DB_PATH=/app/storage/db.sql
      - STATE_DB_PATH=/app/state/bot_state.db
